<title>Off My Plate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #F0F1EC;
    --surface: #FBFBF8;
    --surface-2: #E7EAE2;
    --line: #D8DCD1;
    --line-soft: #E4E7DD;
    --ink: #1C2320;
    --ink-2: #57635B;
    --ink-3: #8A948B;
    --accent: #2E6B58;
    --accent-ink: #1F4C3E;
    --accent-soft: #DEEAE3;
    --alert: #A3512B;
    --alert-soft: #F2E3D9;
    --shadow: 0 1px 2px rgba(28,35,32,.05), 0 10px 24px -18px rgba(28,35,32,.45);
    --btn-ink: #FBFBF8;

    --f-display: "Fraunces", Georgia, "Times New Roman", serif;
    --f-body: "Public Sans", "Helvetica Neue", Arial, sans-serif;
    --f-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #121614;
      --surface: #1A1F1C;
      --surface-2: #232A26;
      --line: #2E3631;
      --line-soft: #262E29;
      --ink: #E7EBE5;
      --ink-2: #9EABA3;
      --ink-3: #6C7A72;
      --accent: #74C2A4;
      --accent-ink: #A9DDC7;
      --accent-soft: #1D2E28;
      --alert: #DE9068;
      --alert-soft: #33231A;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -18px rgba(0,0,0,.8);
      --btn-ink: #0F1512;
    }
  }
  :root[data-theme="dark"] {
    --ground: #121614;
    --surface: #1A1F1C;
    --surface-2: #232A26;
    --line: #2E3631;
    --line-soft: #262E29;
    --ink: #E7EBE5;
    --ink-2: #9EABA3;
    --ink-3: #6C7A72;
    --accent: #74C2A4;
    --accent-ink: #A9DDC7;
    --accent-soft: #1D2E28;
    --alert: #DE9068;
    --alert-soft: #33231A;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -18px rgba(0,0,0,.8);
    --btn-ink: #0F1512;
  }

  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--f-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  h1, h2, h3 { margin: 0; font-family: var(--f-display); font-weight: 500; text-wrap: balance; letter-spacing: -.01em; }
  p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  .eyebrow {
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  /* ---------- shell ---------- */
  .shell { display: grid; grid-template-columns: 1fr; min-height: 100%; }
  @media (min-width: 900px) {
    .shell { grid-template-columns: 216px minmax(0, 1fr); }
  }

  /* ---------- rail (desktop) ---------- */
  .rail { display: none; }
  @media (min-width: 900px) {
    .rail {
      display: block;
      border-right: 1px solid var(--line);
      padding: 28px 16px 40px 24px;
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      align-self: start;
      max-height: 100dvh;
      overflow-y: auto;
    }
  }
  .wordmark { font-family: var(--f-display); font-size: 19px; font-weight: 600; letter-spacing: -.02em; margin-bottom: 26px; display: block; }
  .wordmark span { color: var(--accent); }
  .rail-nav { display: flex; flex-direction: column; gap: 1px; }
  .rail-nav button {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; padding: 7px 10px; border: 0; border-radius: 7px;
    background: transparent; color: var(--ink-2); cursor: pointer; text-align: left;
    font-size: 14.5px;
  }
  .rail-nav button:hover { background: var(--surface-2); color: var(--ink); }
  .rail-nav button[aria-current="true"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  .pill {
    font-family: var(--f-mono); font-size: 11px; line-height: 1.6;
    padding: 0 6px; border-radius: 20px; background: var(--surface-2); color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  .rail-nav button[aria-current="true"] .pill { background: rgba(255,255,255,.5); color: var(--accent-ink); }
  .pill.hot { background: var(--alert-soft); color: var(--alert); }

  /* ---------- tabs (mobile) ---------- */
  .tabs {
    display: flex; gap: 4px; overflow-x: auto; padding: 0 16px 10px;
    border-bottom: 1px solid var(--line); scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    flex: 0 0 auto; border: 0; background: transparent; color: var(--ink-3);
    padding: 6px 10px; border-radius: 20px; cursor: pointer; font-size: 14px; white-space: nowrap;
  }
  .tabs button[aria-current="true"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  @media (min-width: 900px) { .tabs { display: none; } }

  /* ---------- main ---------- */
  .main { min-width: 0; padding: 0 0 72px; }
  .wrap { max-width: 660px; margin: 0 auto; padding-inline: 16px; }
  @media (min-width: 900px) { .wrap { padding-inline: 32px; } .main { padding-top: 8px; } }

  .topbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: var(--ground);
    background: color-mix(in srgb, var(--ground) 92%, transparent);
    backdrop-filter: blur(8px);
    padding-top: 14px;
  }
  .mobilemark { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  @media (min-width: 900px) { .mobilemark { display: none; } }

  /* ---------- quick add ---------- */
  .qa { padding-bottom: 12px; }
  .qa-field {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 11px; padding: 4px 4px 4px 13px; box-shadow: var(--shadow);
  }
  .qa-field:focus-within { border-color: var(--accent); }
  .qa-field input {
    flex: 1; min-width: 0; border: 0; background: transparent; padding: 8px 0; font-size: 15.5px;
  }
  .qa-field input:focus { outline: none; }
  .qa-field input::placeholder { color: var(--ink-3); }
  .btn {
    border: 1px solid transparent; background: var(--accent); color: var(--btn-ink);
    padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600;
  }
  .btn:hover { filter: brightness(1.07); }
  .btn:disabled { opacity: .4; cursor: default; filter: none; }
  .btn-ghost {
    background: transparent; color: var(--ink-2); border-color: var(--line); font-weight: 500;
  }
  .btn-ghost:hover { background: var(--surface-2); color: var(--ink); filter: none; }
  .btn-sm { padding: 4px 10px; font-size: 13px; border-radius: 7px; }

  .qa-hint {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 4px 0; font-size: 13px; color: var(--ink-2);
  }
  .qa-hint:empty { padding: 0; }
  .qa-hint select {
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    padding: 2px 6px; font-size: 12.5px; color: var(--ink);
  }
  .qa-hint .det { font-family: var(--f-mono); font-size: 12px; color: var(--accent); }

  /* ---------- page head ---------- */
  .pagehead { padding: 22px 0 6px; }
  .pagehead h1 { font-size: clamp(27px, 6vw, 34px); line-height: 1.12; }
  .pagehead .eyebrow { margin-bottom: 7px; }
  .pagehead .sub { color: var(--ink-2); font-size: 14.5px; margin-top: 7px; }
  .headrow { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }

  /* ---------- blocks ---------- */
  .block { margin-top: 26px; }
  .block-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    padding-bottom: 9px; margin-bottom: 10px; border-bottom: 1px solid var(--line);
  }
  .block-head h2 { font-size: 15px; font-family: var(--f-body); font-weight: 600; letter-spacing: 0; }
  .block-head .meta { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); text-align: right; }
  .block-head.alert { border-bottom-color: var(--alert); }
  .block-head.alert h2 { color: var(--alert); }

  .list { display: flex; flex-direction: column; gap: 1px; }

  .row {
    display: flex; align-items: flex-start; gap: 11px;
    padding: 9px 10px; border-radius: 9px; background: transparent;
  }
  .row:hover { background: var(--surface); }
  .row.flag { background: var(--alert-soft); }
  .row.flag:hover { background: var(--alert-soft); }
  .row-body { flex: 1; min-width: 0; }
  .row-title { font-size: 15px; line-height: 1.35; }
  .row.done .row-title { color: var(--ink-3); text-decoration: line-through; }
  .row-sub { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
  .row-sub .when { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
  .row-sub .late { color: var(--alert); font-weight: 600; }
  .row-actions { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
  .row .icon-btn { opacity: 0; }
  .row:hover .icon-btn, .row:focus-within .icon-btn { opacity: 1; }
  @media (hover: none) { .row .icon-btn { opacity: 1; } }

  .check {
    flex: 0 0 auto; width: 19px; height: 19px; margin-top: 3px; padding: 0;
    border-radius: 50%; border: 1.5px solid var(--ink-3); background: transparent; cursor: pointer;
    display: grid; place-items: center;
  }
  .check:hover { border-color: var(--accent); }
  .check svg { opacity: 0; width: 11px; height: 11px; }
  .check[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
  .check[aria-pressed="true"] svg { opacity: 1; }
  .check.square { border-radius: 6px; }

  .icon-btn {
    border: 0; background: transparent; color: var(--ink-3); cursor: pointer;
    padding: 4px; border-radius: 6px; line-height: 0;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .icon-btn.danger:hover { color: var(--alert); }

  .tag {
    font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase;
    padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2);
  }
  .tag.accent { background: var(--accent-soft); color: var(--accent-ink); }
  .tag.alert { background: var(--alert-soft); color: var(--alert); }

  .card {
    background: var(--surface); border: 1px solid var(--line-soft);
    border-radius: 11px; padding: 14px 15px;
  }
  .card.nudge { border-left: 3px solid var(--accent); }

  .empty {
    color: var(--ink-2); font-size: 14px; padding: 10px 0 2px;
  }
  .clear {
    text-align: center; padding: 44px 20px; border: 1px dashed var(--line); border-radius: 12px; margin-top: 8px;
  }
  .clear h3 { font-size: 21px; margin-bottom: 6px; }
  .clear p { color: var(--ink-2); font-size: 14px; }

  .groupname {
    font-family: var(--f-mono); font-size: 11px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--ink-3); margin: 18px 0 4px; padding-left: 10px;
  }
  .groupname:first-child { margin-top: 0; }

  .viewbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 2px; }

  /* ---------- onboarding ---------- */
  .onboard { display: grid; gap: 14px; margin-top: 18px; }
  .onboard .card { display: grid; gap: 10px; }
  .onboard h3 { font-size: 17px; }
  .onboard p { color: var(--ink-2); font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    border: 1px solid var(--line); background: var(--ground); color: var(--ink-2);
    padding: 5px 11px; border-radius: 20px; cursor: pointer; font-size: 13px; text-align: left;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
  .chip .k { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); }

  .banner {
    display: flex; gap: 10px; align-items: baseline; justify-content: space-between; flex-wrap: wrap;
    background: var(--surface-2); border-radius: 9px; padding: 9px 13px; font-size: 13px; color: var(--ink-2);
    margin-top: 14px;
  }

  /* ---------- dialog ---------- */
  dialog {
    border: 1px solid var(--line); border-radius: 14px; padding: 0; max-width: 460px; width: calc(100% - 32px);
    background: var(--surface); color: var(--ink); box-shadow: 0 24px 60px -20px rgba(0,0,0,.4);
  }
  dialog::backdrop { background: rgba(16,22,19,.42); backdrop-filter: blur(2px); }
  .dlg-head { padding: 17px 20px 0; }
  .dlg-head h2 { font-size: 20px; }
  .dlg-body { padding: 16px 20px; display: grid; gap: 12px; }
  .field { display: grid; gap: 4px; }
  .field label { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
  .field input, .field select, .field textarea {
    border: 1px solid var(--line); background: var(--ground); border-radius: 8px; padding: 8px 10px; font-size: 14.5px; width: 100%;
  }
  .field textarea { resize: vertical; min-height: 62px; font-family: inherit; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .dlg-foot {
    display: flex; gap: 8px; justify-content: flex-end; align-items: center;
    padding: 13px 20px; border-top: 1px solid var(--line-soft); background: var(--ground);
    border-radius: 0 0 13px 13px;
  }
  .dlg-foot .spacer { margin-right: auto; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 60;
    background: var(--ink); color: var(--ground); padding: 9px 16px; border-radius: 20px;
    font-size: 13.5px; box-shadow: var(--shadow); display: flex; gap: 12px; align-items: center;
  }
  .toast button { border: 0; background: transparent; color: var(--accent); font-weight: 600; cursor: pointer; font-size: 13.5px; }
  @media (prefers-reduced-motion: no-preference) {
    .toast { animation: rise .18s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } }
  }
</style>

<div class="shell">
  <aside class="rail">
    <span class="wordmark">Off My Plate<span>.</span></span>
    <nav class="rail-nav" id="rail"></nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="wrap">
        <div class="mobilemark">
          <span class="wordmark" style="margin:0;font-size:17px">Off My Plate<span>.</span></span>
        </div>
        <form class="qa" id="qa-form" autocomplete="off">
          <div class="qa-field">
            <input id="qa-input" type="text" placeholder="Add anything — “buy oat milk”…" aria-label="Quick add">
            <button class="btn" type="submit" id="qa-submit">Add</button>
          </div>
          <div class="qa-hint" id="qa-hint"></div>
        </form>
      </div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="wrap" id="view"></div>
  </main>
</div>

<dialog id="editor">
  <form method="dialog" id="editor-form">
    <div class="dlg-head"><h2 id="editor-title">Edit</h2></div>
    <div class="dlg-body" id="editor-body"></div>
    <div class="dlg-foot">
      <button type="button" class="btn btn-ghost btn-sm spacer" id="editor-delete">Delete</button>
      <button type="button" class="btn btn-ghost" id="editor-cancel">Cancel</button>
      <button type="submit" class="btn" id="editor-save">Save</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  "use strict";

  /* =====================================================================
     Collections and shapes
     ===================================================================== */
  const COLLS = ["appointments", "tasks", "buy", "chores", "people", "projects"];
  const state = { appointments: [], tasks: [], buy: [], chores: [], people: [], projects: [] };
  let db = null;
  let dbTried = false;

  const BUY_CATEGORIES = [
    ["groceries", "Groceries"], ["household", "Household"],
    ["gifts", "Gifts"], ["other", "Other"],
  ];
  const CADENCES = [[7, "Weekly"], [14, "Every 2 weeks"], [30, "Monthly"], [60, "Every 2 months"], [90, "Every 3 months"], [180, "Twice a year"]];

  /* =====================================================================
     Storage — db when granted, localStorage otherwise
     ===================================================================== */
  const LS_KEY = "offmyplate.v1";

  function loadLocal() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      for (const c of COLLS) if (Array.isArray(parsed[c])) state[c] = parsed[c];
    } catch (e) { /* private window, blocked storage — start empty */ }
  }
  function saveLocal() {
    if (db) return;
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function find(coll, id) { return state[coll].find((d) => d.id === id); }

  async function create(coll, data) {
    const id = newId();
    const body = Object.assign({ createdAt: new Date().toISOString() }, data);
    state[coll] = state[coll].concat([Object.assign({ id }, body)]);
    render(); saveLocal();
    if (db) {
      try { await db.doc(coll + "/" + id).set(body); }
      catch (e) { reportDbError(e); }
    }
    return id;
  }

  async function patch(coll, id, changes) {
    const doc = find(coll, id);
    if (!doc) return;
    Object.assign(doc, changes);
    state[coll] = state[coll].slice();
    render(); saveLocal();
    if (db) {
      try { await db.doc(coll + "/" + id).update(changes); }
      catch (e) { reportDbError(e); }
    }
  }

  async function remove(coll, id) {
    state[coll] = state[coll].filter((d) => d.id !== id);
    render(); saveLocal();
    if (db) {
      try { await db.doc(coll + "/" + id).delete(); }
      catch (e) { reportDbError(e); }
    }
  }

  let dbWarned = false;
  function reportDbError(e) {
    const code = e && e.code;
    if (code === "quota_exceeded") { toast("This list is full. Delete some finished items to add more."); return; }
    if (dbWarned) return;
    dbWarned = true;
    toast("Couldn’t save that change to your other devices.");
  }

  async function connect() {
    let ns = null;
    try { ns = await window.claude?.use?.("db"); } catch (e) { ns = null; }
    dbTried = true;
    if (!ns) { render(); return; }
    db = ns;
    for (const coll of COLLS) {
      ns.collection(coll).onSnapshot(
        (snap) => {
          state[coll] = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
          render();
        },
        (err) => { if (err.code !== "revoked") reportDbError(err); }
      );
    }
    render();
  }

  /* =====================================================================
     Dates — everything local, stored as YYYY-MM-DD / HH:MM
     ===================================================================== */
  const DAY_MS = 86400000;
  const DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const MON_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  function iso(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function fromISO(s) {
    const p = String(s).split("-").map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }
  function today() { return iso(new Date()); }
  function shift(s, n) { const d = fromISO(s); d.setDate(d.getDate() + n); return iso(d); }
  function daysFromToday(s) {
    if (!s) return null;
    return Math.round((fromISO(s) - fromISO(today())) / DAY_MS);
  }
  function fmtDay(s, opts) {
    if (!s) return "";
    const n = daysFromToday(s);
    if (n === 0) return "Today";
    if (n === 1) return "Tomorrow";
    if (n === -1) return "Yesterday";
    const d = fromISO(s);
    const base = (n > 1 && n < 7 ? DAY_NAMES[d.getDay()] : DAY_NAMES[d.getDay()].slice(0, 3) + " " + MON_NAMES[d.getMonth()] + " " + d.getDate());
    if (opts && opts.year && d.getFullYear() !== new Date().getFullYear()) return base + ", " + d.getFullYear();
    return base;
  }
  function fmtTime(t) {
    if (!t) return "";
    const p = String(t).split(":").map(Number);
    const h = p[0], m = p[1] || 0;
    const ap = h >= 12 ? "PM" : "AM";
    const h12 = h % 12 === 0 ? 12 : h % 12;
    return h12 + (m ? ":" + String(m).padStart(2, "0") : "") + " " + ap;
  }
  function agoLabel(n) {
    if (n === null || n === undefined) return "never";
    if (n === 0) return "today";
    if (n === 1) return "yesterday";
    if (n < 7) return n + " days ago";
    if (n < 14) return "last week";
    if (n < 60) return Math.round(n / 7) + " weeks ago";
    return Math.round(n / 30) + " months ago";
  }
  function daysSince(s) {
    if (!s) return null;
    return Math.max(0, Math.round((fromISO(today()) - fromISO(s)) / DAY_MS));
  }

  /* =====================================================================
     Quick-add parsing
     ===================================================================== */
  const WEEKDAYS = { sun: 0, sunday: 0, mon: 1, monday: 1, tue: 2, tues: 2, tuesday: 2, wed: 3, weds: 3, wednesday: 3, thu: 4, thur: 4, thurs: 4, thursday: 4, fri: 5, friday: 5, sat: 6, saturday: 6 };
  const MONTHS = { jan: 0, january: 0, feb: 1, february: 1, mar: 2, march: 2, apr: 3, april: 3, may: 4, jun: 5, june: 5, jul: 6, july: 6, aug: 7, august: 7, sep: 8, sept: 8, september: 8, oct: 9, october: 9, nov: 10, november: 10, dec: 11, december: 11 };
  const GROCERY = /\b(milk|oat|eggs?|bread|butter|cheese|yogurt|coffee|tea|sugar|flour|rice|pasta|chicken|beef|fish|salmon|apples?|bananas?|onions?|garlic|lettuce|spinach|tomato|avocado|berries|lemons?|olive oil|snacks?|cereal|beans|salsa|chips|wine|beer|produce|groceries)\b/;
  const HOUSEHOLD = /\b(paper towels?|toilet paper|detergent|soap|shampoo|toothpaste|sponges?|batteries|light ?bulbs?|trash bags?|dish soap|cleaner|filters?|floss|razors?)\b/;
  const GIFTS = /\b(gift|present|birthday|card for|anniversary|wedding)\b/;
  const APPT_WORDS = /\b(appointment|appt|dentist|doctor|dr\.?|haircut|vet|therapy|therapist|checkup|check-up|physical|eye exam|optometrist|dermatologist|meeting|lunch with|dinner with|coffee with|flight|train|interview|class|closing)\b/;

  function parseQuick(raw) {
    let text = " " + String(raw).trim() + " ";
    const cut = [];
    const eat = (re) => {
      const m = re.exec(text);
      if (m) { cut.push(m[0]); text = text.replace(m[0], " "); }
      return m;
    };

    let kind = null, date = null, time = null, everyDays = null, cadenceDays = null, status = "booked", where = "";

    // --- explicit prefixes -------------------------------------------------
    let m;
    if ((m = /^\s*(chore|chores)\s*:\s*/i.exec(text))) { kind = "chores"; text = text.replace(m[0], " "); }
    else if ((m = /^\s*(project|proj|idea)\s*:\s*/i.exec(text))) { kind = "projects"; text = text.replace(m[0], " "); }
    else if ((m = /^\s*(appointment|appt|event)\s*:\s*/i.exec(text))) { kind = "appointments"; text = text.replace(m[0], " "); }
    else if ((m = /^\s*(task|todo|to-do)\s*:\s*/i.exec(text))) { kind = "tasks"; text = text.replace(m[0], " "); }
    else if ((m = /^\s*(buy|shopping)\s*:\s*/i.exec(text))) { kind = "buy"; text = text.replace(m[0], " "); }
    else if ((m = /^\s*(keep in touch with|check in (?:on|with)|catch up with|stay in touch with|reach out to)\s+/i.exec(text))) { kind = "people"; text = text.replace(m[0], " "); }
    else if ((m = /^\s*(buy|get|pick up|grab|order|restock)\s+/i.exec(text))) { kind = "buy"; text = text.replace(m[0], " "); }
    else if ((m = /^\s*(book|schedule|set up|make)\s+(?:an?\s+)?(?=.*\b(appointment|appt|dentist|doctor|haircut|vet|exam|checkup|check-up|physical|cleaning|call|visit)\b)/i.exec(text))) {
      kind = "appointments"; status = "to_book"; text = text.replace(m[0], " ");
    }

    // --- location ----------------------------------------------------------
    if ((m = eat(/\s@\s*([^@]+?)(?=\s{2,}|\s*$)/i))) where = m[1].trim();

    // --- recurrence --------------------------------------------------------
    if ((m = eat(/\bevery\s+other\s+(day|week|month)\b/i))) {
      everyDays = { day: 2, week: 14, month: 60 }[m[1].toLowerCase()];
    } else if ((m = eat(/\bevery\s+(\d+)\s*(day|week|month)s?\b/i))) {
      everyDays = Number(m[1]) * { day: 1, week: 7, month: 30 }[m[2].toLowerCase()];
    } else if ((m = eat(/\bevery\s+(day|week|month|morning|night|weekday)\b/i))) {
      everyDays = { day: 1, morning: 1, night: 1, weekday: 1, week: 7, month: 30 }[m[1].toLowerCase()];
    } else if ((m = eat(/\b(daily|weekly|biweekly|monthly|quarterly|yearly)\b/i))) {
      everyDays = { daily: 1, weekly: 7, biweekly: 14, monthly: 30, quarterly: 90, yearly: 365 }[m[1].toLowerCase()];
    }

    // --- time of day -------------------------------------------------------
    if ((m = eat(/\b(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i))) {
      let h = Number(m[1]) % 12;
      if (/pm/i.test(m[3])) h += 12;
      time = String(h).padStart(2, "0") + ":" + String(Number(m[2] || 0)).padStart(2, "0");
    } else if ((m = eat(/\b(?:at\s+)?([01]?\d|2[0-3]):([0-5]\d)\b/))) {
      time = String(Number(m[1])).padStart(2, "0") + ":" + m[2];
    } else if ((m = eat(/\b(noon|midnight)\b/i))) {
      time = /noon/i.test(m[1]) ? "12:00" : "00:00";
    }

    // --- date --------------------------------------------------------------
    if ((m = eat(/\b(today|tonight|this evening)\b/i))) {
      date = today();
      if (!time && /tonight|evening/i.test(m[1])) time = "19:00";
    } else if ((m = eat(/\b(tomorrow|tmrw|tmw)\b/i))) {
      date = shift(today(), 1);
    } else if ((m = eat(/\bin\s+(\d+)\s*(day|week|month)s?\b/i))) {
      date = shift(today(), Number(m[1]) * { day: 1, week: 7, month: 30 }[m[2].toLowerCase()]);
    } else if ((m = eat(/\b(?:on\s+|this\s+|next\s+)?(sun|sunday|mon|monday|tue|tues|tuesday|wed|weds|wednesday|thu|thur|thurs|thursday|fri|friday|sat|saturday)\b/i))) {
      const want = WEEKDAYS[m[1].toLowerCase()];
      const now = fromISO(today());
      let delta = (want - now.getDay() + 7) % 7;
      if (delta === 0) delta = 7;
      if (/next/i.test(m[0]) && delta < 7) delta += 7;
      date = shift(today(), delta);
    } else if ((m = eat(/\b(?:on\s+)?(jan|january|feb|february|mar|march|apr|april|may|jun|june|jul|july|aug|august|sep|sept|september|oct|october|nov|november|dec|december)\.?\s+(\d{1,2})(?:st|nd|rd|th)?\b/i))) {
      date = pickYear(MONTHS[m[1].toLowerCase()], Number(m[2]));
    } else if ((m = eat(/\b(\d{1,2})(?:st|nd|rd|th)?\s+(?:of\s+)?(jan|january|feb|february|mar|march|apr|april|may|jun|june|jul|july|aug|august|sep|sept|september|oct|october|nov|november|dec|december)\b/i))) {
      date = pickYear(MONTHS[m[2].toLowerCase()], Number(m[1]));
    } else if ((m = eat(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))) {
      if (m[3]) {
        const y = Number(m[3].length === 2 ? "20" + m[3] : m[3]);
        date = iso(new Date(y, Number(m[1]) - 1, Number(m[2])));
      } else {
        date = pickYear(Number(m[1]) - 1, Number(m[2]));
      }
    } else if ((m = eat(/\bnext week\b/i))) {
      date = shift(today(), 7);
    }

    // --- title cleanup -----------------------------------------------------
    let title = text
      .replace(/\s+(on|at|by|this|the|for|to)\s*$/i, " ")
      .replace(/^\s*(on|at|by|this|the)\s+/i, " ")
      .replace(/\s{2,}/g, " ")
      .trim()
      .replace(/[,\-–—]\s*$/, "")
      .trim();
    if (title) title = title[0].toUpperCase() + title.slice(1);

    // --- route -------------------------------------------------------------
    if (!kind) {
      if (everyDays) kind = "chores";
      else if (time) kind = "appointments";
      else if (date && APPT_WORDS.test(" " + title.toLowerCase() + " ")) kind = "appointments";
      else kind = "tasks";
    }
    if (kind === "people") {
      cadenceDays = everyDays || 14;
      everyDays = null;
    }
    if (kind === "chores" && !everyDays) everyDays = 7;
    if (kind === "appointments" && !date && status === "booked") status = "to_book";

    const out = { kind, title, date, time, everyDays, cadenceDays, status, where };
    return out;
  }

  function pickYear(monthIdx, day) {
    const now = new Date();
    let y = now.getFullYear();
    let d = new Date(y, monthIdx, day);
    if ((fromISO(today()) - d) > 120 * DAY_MS) { y += 1; d = new Date(y, monthIdx, day); }
    return iso(d);
  }

  function buyCategory(title) {
    const t = " " + title.toLowerCase() + " ";
    if (GIFTS.test(t)) return "gifts";
    if (HOUSEHOLD.test(t)) return "household";
    if (GROCERY.test(t)) return "groceries";
    return "other";
  }

  function docFromParse(p) {
    switch (p.kind) {
      case "appointments":
        return { title: p.title, status: p.status, date: p.date || null, time: p.time || null, where: p.where || "", notes: "", done: false };
      case "tasks":
        return { title: p.title, due: p.date || null, notes: "", done: false };
      case "buy":
        return { title: p.title, category: buyCategory(p.title), notes: "", done: false };
      case "chores":
        return { title: p.title, everyDays: p.everyDays || 7, lastDone: null, notes: "" };
      case "people":
        return { name: p.title, cadenceDays: p.cadenceDays || 14, lastContact: null, note: "" };
      case "projects":
        return { title: p.title, nextStep: "", status: "active", lastTouched: today(), notes: "" };
    }
  }

  const KIND_LABEL = {
    appointments: "Schedule", tasks: "Tasks", buy: "Buy",
    chores: "Chores", people: "People", projects: "Projects",
  };

  /* =====================================================================
     Derived views
     ===================================================================== */
  function choreDue(c) {
    const since = daysSince(c.lastDone);
    if (since === null) return 0;                // never done — due now
    return (c.everyDays || 7) - since;           // <= 0 means due
  }
  function personDue(p) {
    const since = daysSince(p.lastContact);
    if (since === null) return 0;
    return (p.cadenceDays || 14) - since;
  }
  function projectStale(p) {
    const since = daysSince(p.lastTouched);
    return since === null ? 999 : since;
  }

  function byDateTime(a, b) {
    const d = String(a.date || "9999").localeCompare(String(b.date || "9999"));
    if (d !== 0) return d;
    return String(a.time || "99:99").localeCompare(String(b.time || "99:99"));
  }

  function todayData() {
    const t = today();
    const appts = state.appointments.filter((a) => a.status !== "to_book" && !a.done && a.date);
    return {
      now: appts.filter((a) => a.date === t).sort(byDateTime),
      week: appts.filter((a) => a.date > t && a.date <= shift(t, 7)).sort(byDateTime),
      later: appts.filter((a) => a.date > shift(t, 7)).sort(byDateTime),
      missed: appts.filter((a) => a.date < t).sort(byDateTime),
      toBook: state.appointments.filter((a) => a.status === "to_book" && !a.done),
      dueTasks: state.tasks.filter((x) => !x.done && x.due && x.due <= t)
        .sort((a, b) => String(a.due).localeCompare(String(b.due))),
      chores: state.chores.map((c) => Object.assign({ _due: choreDue(c) }, c))
        .filter((c) => c._due <= 0).sort((a, b) => a._due - b._due),
      people: state.people.map((p) => Object.assign({ _due: personDue(p) }, p))
        .filter((p) => p._due <= 0).sort((a, b) => a._due - b._due),
      stalled: state.projects.filter((p) => (p.status || "active") === "active" && projectStale(p) >= 14)
        .sort((a, b) => projectStale(b) - projectStale(a)),
    };
  }

  /* =====================================================================
     Rendering helpers
     ===================================================================== */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  const TICK = '<svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M1.5 6.3 4.4 9.2 10.5 2.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const PENCIL = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M11.2 2.3a1.6 1.6 0 0 1 2.3 2.3l-7.4 7.4-3 .7.7-3 7.4-7.4Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>';
  const TRASH = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5 5 13h6l.5-8.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function checkBtn(coll, id, on, square) {
    return '<button class="check' + (square ? " square" : "") + '" data-act="toggle" data-coll="' + coll + '" data-id="' + id +
      '" aria-pressed="' + (on ? "true" : "false") + '" aria-label="' + (on ? "Mark not done" : "Mark done") + '">' + TICK + "</button>";
  }
  function rowActions(coll, id, extra) {
    return '<div class="row-actions">' + (extra || "") +
      '<button class="icon-btn" data-act="edit" data-coll="' + coll + '" data-id="' + id + '" aria-label="Edit">' + PENCIL + "</button>" +
      '<button class="icon-btn danger" data-act="del" data-coll="' + coll + '" data-id="' + id + '" aria-label="Delete">' + TRASH + "</button></div>";
  }
  function row(opts) {
    return '<div class="row' + (opts.done ? " done" : "") + (opts.flag ? " flag" : "") + '">' +
      (opts.lead || "") +
      '<div class="row-body"><div class="row-title">' + esc(opts.title) + "</div>" +
      (opts.sub ? '<div class="row-sub">' + opts.sub + "</div>" : "") + "</div>" +
      (opts.actions || "") + "</div>";
  }
  function block(title, meta, body, alert) {
    if (!body) return "";
    return '<section class="block"><div class="block-head' + (alert ? " alert" : "") + '"><h2>' + esc(title) + "</h2>" +
      (meta ? '<span class="meta">' + esc(meta) + "</span>" : "") + "</div>" + body + "</section>";
  }
  function listOf(items, fn) {
    if (!items.length) return "";
    return '<div class="list">' + items.map(fn).join("") + "</div>";
  }

  function apptRow(a, opts) {
    const bits = [];
    if (a.date) bits.push('<span class="when">' + esc(fmtDay(a.date, { year: true })) + (a.time ? " · " + esc(fmtTime(a.time)) : " · all day") + "</span>");
    if (a.where) bits.push(esc(a.where));
    if (a.date && a.date < today()) bits.push('<span class="late">passed</span>');
    if (a.notes) bits.push(esc(a.notes));
    return row({
      title: a.title, done: !!a.done,
      lead: checkBtn("appointments", a.id, !!a.done),
      sub: bits.join(""),
      actions: rowActions("appointments", a.id),
      flag: opts && opts.flag,
    });
  }
  function toBookRow(a) {
    const bits = ['<span class="tag alert">not booked</span>'];
    if (a.where) bits.push(esc(a.where));
    if (a.notes) bits.push(esc(a.notes));
    return row({
      title: a.title,
      lead: '<span class="check" aria-hidden="true" style="border-style:dashed;cursor:default"></span>',
      sub: bits.join(""),
      actions: rowActions("appointments", a.id,
        '<button class="btn btn-ghost btn-sm" data-act="edit" data-coll="appointments" data-id="' + a.id + '">Pick a date</button>'),
    });
  }

  function taskRow(t) {
    const bits = [];
    if (t.due) {
      const n = daysFromToday(t.due);
      const late = n < 0;
      bits.push('<span class="when' + (late ? " late" : "") + '">' + (late ? "Due " + esc(fmtDay(t.due)) : esc(fmtDay(t.due, { year: true }))) + "</span>");
    }
    if (t.notes) bits.push(esc(t.notes));
    return row({
      title: t.title, done: !!t.done,
      lead: checkBtn("tasks", t.id, !!t.done),
      sub: bits.join(""),
      actions: rowActions("tasks", t.id),
    });
  }
  function buyRow(b) {
    return row({
      title: b.title, done: !!b.done,
      lead: checkBtn("buy", b.id, !!b.done, true),
      sub: b.notes ? esc(b.notes) : "",
      actions: rowActions("buy", b.id),
    });
  }
  function choreRow(c) {
    const due = c._due !== undefined ? c._due : choreDue(c);
    const since = daysSince(c.lastDone);
    const bits = ['<span class="when' + (due < 0 ? " late" : "") + '">' +
      (due > 0 ? "in " + due + (due === 1 ? " day" : " days") : due === 0 ? "due today" : (-due) + (due === -1 ? " day over" : " days over")) + "</span>"];
    bits.push('<span class="tag">every ' + esc(everyLabel(c.everyDays)) + "</span>");
    bits.push("last done " + esc(agoLabel(since)));
    return row({
      title: c.title,
      lead: '<button class="check" data-act="chore-done" data-id="' + c.id + '" aria-pressed="false" aria-label="Mark done today">' + TICK + "</button>",
      sub: bits.join(""),
      actions: rowActions("chores", c.id),
    });
  }
  function personRow(p) {
    const due = p._due !== undefined ? p._due : personDue(p);
    const since = daysSince(p.lastContact);
    const bits = ["last talked " + esc(agoLabel(since)), '<span class="tag">' + esc(cadenceLabel(p.cadenceDays)) + "</span>"];
    if (p.note) bits.push(esc(p.note));
    return row({
      title: p.name,
      lead: '<button class="check" data-act="person-touch" data-id="' + p.id + '" aria-pressed="false" aria-label="Mark that you reached out">' + TICK + "</button>",
      sub: bits.join(""),
      actions: rowActions("people", p.id),
      flag: false,
    });
  }
  function projectRow(p) {
    const stale = projectStale(p);
    const bits = [];
    if (p.nextStep) bits.push("Next: " + esc(p.nextStep));
    else bits.push('<span class="late">no next step yet</span>');
    bits.push('<span class="when">touched ' + esc(agoLabel(stale === 999 ? null : stale)) + "</span>");
    return row({
      title: p.title,
      lead: '<button class="check" data-act="project-touch" data-id="' + p.id + '" aria-pressed="false" aria-label="Mark worked on today">' + TICK + "</button>",
      sub: bits.join(""),
      actions: rowActions("projects", p.id),
    });
  }
  function everyLabel(n) {
    if (!n) return "week";
    if (n === 1) return "day";
    if (n === 7) return "week";
    if (n === 14) return "2 weeks";
    if (n === 30) return "month";
    if (n === 365) return "year";
    if (n % 7 === 0) return (n / 7) + " weeks";
    return n + " days";
  }
  function cadenceLabel(n) {
    const hit = CADENCES.find((c) => c[0] === n);
    return hit ? hit[1] : "every " + everyLabel(n);
  }

  /* =====================================================================
     Views
     ===================================================================== */
  let view = "today";

  const NAV = [
    ["today", "Today"], ["appointments", "Schedule"], ["tasks", "Tasks"],
    ["buy", "Buy"], ["chores", "Chores"], ["people", "People"], ["projects", "Projects"],
  ];

  function navCounts() {
    const d = todayData();
    return {
      today: { n: d.now.length + d.dueTasks.length + Math.min(3, d.chores.length), hot: d.dueTasks.some((t) => t.due < today()) },
      appointments: { n: d.now.length + d.week.length + d.toBook.length, hot: d.toBook.length > 0 },
      tasks: { n: state.tasks.filter((t) => !t.done).length, hot: d.dueTasks.length > 0 },
      buy: { n: state.buy.filter((b) => !b.done).length, hot: false },
      chores: { n: d.chores.length, hot: false },
      people: { n: d.people.length, hot: false },
      projects: { n: state.projects.filter((p) => (p.status || "active") === "active").length, hot: d.stalled.length > 0 },
    };
  }

  function renderNav() {
    const counts = navCounts();
    const rail = NAV.map(([k, label]) => {
      const c = counts[k];
      const pill = c && c.n ? '<span class="pill' + (c.hot ? " hot" : "") + '">' + c.n + "</span>" : "";
      return '<button data-act="nav" data-view="' + k + '" aria-current="' + (view === k) + '">' + esc(label) + pill + "</button>";
    }).join("");
    document.getElementById("rail").innerHTML = rail;
    document.getElementById("tabs").innerHTML = NAV.map(([k, label]) => {
      const c = counts[k];
      return '<button data-act="nav" data-view="' + k + '" aria-current="' + (view === k) + '">' + esc(label) +
        (c && c.n ? " " + c.n : "") + "</button>";
    }).join("");
  }

  function greeting() {
    const h = new Date().getHours();
    if (h < 5) return "Still up";
    if (h < 12) return "Good morning";
    if (h < 17) return "Good afternoon";
    if (h < 21) return "Good evening";
    return "Winding down";
  }

  function pageHead(eyebrow, title, sub, action) {
    return '<header class="pagehead"><div class="headrow"><div>' +
      '<div class="eyebrow">' + esc(eyebrow) + "</div>" +
      "<h1>" + esc(title) + "</h1>" +
      (sub ? '<p class="sub">' + sub + "</p>" : "") + "</div>" +
      (action || "") + "</div></header>";
  }
  function addBtn(coll, label) {
    return '<button class="btn btn-ghost btn-sm" data-act="new" data-coll="' + coll + '">' + esc(label) + "</button>";
  }

  function viewToday() {
    const d = todayData();
    const now = new Date();
    const dateLine = DAY_NAMES[now.getDay()] + ", " + MON_NAMES[now.getMonth()] + " " + now.getDate();
    const total = d.now.length + d.dueTasks.length + d.chores.length + d.people.length + d.stalled.length + d.missed.length;

    let sub;
    if (!hasAnything()) sub = "Everything you need to remember, in one calm place.";
    else if (total === 0) sub = "Nothing needs you today. The lists are all up to date.";
    else {
      const parts = [];
      if (d.now.length) parts.push(d.now.length + (d.now.length === 1 ? " appointment" : " appointments"));
      if (d.dueTasks.length) parts.push(d.dueTasks.length + (d.dueTasks.length === 1 ? " task" : " tasks"));
      if (d.chores.length) parts.push(Math.min(3, d.chores.length) + " chores");
      sub = parts.length ? parts.join(", ") + " — that's it." : "Just a couple of small things.";
    }

    let html = pageHead(dateLine, greeting() + ".", sub);

    if (!hasAnything()) return html + onboarding();

    // Missed appointments first — they need a decision.
    html += block("Slipped past", null, listOf(d.missed, (a) => apptRow(a, { flag: true })), true);

    const nowBody = listOf(d.now, apptRow) + listOf(d.dueTasks.slice(0, 6), taskRow);
    html += block("Today", d.dueTasks.length > 6 ? (d.dueTasks.length - 6) + " more on Tasks" : null, nowBody);

    // Chores: only ever the top three, with reassurance about the rest.
    if (d.chores.length) {
      const pick = d.chores.slice(0, 3);
      const rest = d.chores.length - pick.length;
      html += block(
        "Three chores, that's all",
        rest > 0 ? rest + " more can wait" : null,
        listOf(pick, choreRow)
      );
    }

    if (d.people.length) {
      html += block("Worth a call", d.people.length > 2 ? d.people.length - 2 + " more" : null, listOf(d.people.slice(0, 2), personRow));
    }

    if (d.toBook.length) {
      html += block("Still need to book", d.toBook.length > 3 ? d.toBook.length - 3 + " more on Schedule" : null,
        listOf(d.toBook.slice(0, 3), toBookRow));
    }

    if (d.stalled.length) {
      const p = d.stalled[0];
      html += block("Picking this back up?", d.stalled.length > 1 ? d.stalled.length - 1 + " others stalled" : null,
        '<div class="card nudge">' +
        '<div class="eyebrow">Untouched ' + esc(agoLabel(projectStale(p) === 999 ? null : projectStale(p))) + "</div>" +
        '<h3 style="margin:5px 0 6px;font-size:18px">' + esc(p.title) + "</h3>" +
        '<p style="color:var(--ink-2);font-size:14px">' + (p.nextStep ? "Next step: " + esc(p.nextStep) : "No next step written down — that's usually why it stalled.") + "</p>" +
        '<div class="chips" style="margin-top:11px">' +
        '<button class="btn btn-sm" data-act="project-touch" data-id="' + p.id + '">I worked on it</button>' +
        '<button class="btn btn-ghost btn-sm" data-act="edit" data-coll="projects" data-id="' + p.id + '">Set the next step</button>' +
        '<button class="btn btn-ghost btn-sm" data-act="someday" data-id="' + p.id + '">Park it for now</button>' +
        "</div></div>");
    }

    if (d.week.length) {
      html += block("Rest of the week", null, listOf(d.week, apptRow));
    }

    if (total === 0) {
      html += '<div class="clear"><h3>You’re clear.</h3><p>Nothing due, nothing overdue, nobody waiting to hear from you.</p></div>';
    }
    return html;
  }

  function viewTasks() {
    const open = state.tasks.filter((t) => !t.done);
    const done = state.tasks.filter((t) => t.done);
    const t = today();
    const overdue = open.filter((x) => x.due && x.due < t).sort((a, b) => a.due.localeCompare(b.due));
    const soon = open.filter((x) => x.due && x.due >= t && x.due <= shift(t, 7)).sort((a, b) => a.due.localeCompare(b.due));
    const later = open.filter((x) => x.due && x.due > shift(t, 7)).sort((a, b) => a.due.localeCompare(b.due));
    const undated = open.filter((x) => !x.due);

    let html = pageHead("Tasks", "One-off things", open.length ? open.length + " open" : null, addBtn("tasks", "+ Add"));
    html += block("Overdue", null, listOf(overdue, taskRow), true);

    html += block("Later", null, listOf(later, taskRow));
    html += block("No date", "whenever you get to them", listOf(undated, taskRow));

  /* =====================================================================

  const qaInput = document.getElementById("qa-input");

  let override = null;

  function describeParse(p) {
    const bits = [];
    if (p.kind === "appointments") {
      if (p.status === "to_book") bits.push("to book");
      else if (p.date) bits.push(fmtDay(p.date, { year: true }) + (p.time ? " at " + fmtTime(p.time) : ", all day"));
    } else if (p.kind === "tasks" && p.date) bits.push("due " + fmtDay(p.date, { year: true }));
    else if (p.kind === "chores") bits.push("every " + everyLabel(p.everyDays));
    else if (p.kind === "people") bits.push(cadenceLabel(p.cadenceDays).toLowerCase());
    else if (p.kind === "buy") bits.push(BUY_CATEGORIES.find((c) => c[0] === buyCategory(p.title))[1].toLowerCase());
    if (p.where) bits.push("at " + p.where);
    return bits.join(" · ");
  }

  function updateHint() {
    const raw = qaInput.value.trim();
    if (!raw) { qaHint.innerHTML = ""; return; }
    const p = parseQuick(raw);
    const kind = override || p.kind;
    const detail = describeParse(Object.assign({}, p, { kind }));
    qaHint.innerHTML = "<span>Goes to</span>" +
      '<select id="qa-kind" aria-label="Where this goes">' +
      NAV.slice(1).map(([k]) => '<option value="' + k + '"' + (k === kind ? " selected" : "") + ">" + esc(KIND_LABEL[k]) + "</option>").join("") +
      "</select>" + (detail ? '<span class="det">' + esc(detail) + "</span>" : "");
    const sel = document.getElementById("qa-kind");
    sel.addEventListener("change", () => { override = sel.value; updateHint(); });
  }

  qaInput.addEventListener("input", () => { override = null; updateHint(); });

    const raw = qaInput.value.trim();
    if (!raw) return;

    appointments: {
      title: "Appointment",
      fields: [

      ],
      blank: { title: "", due: null, notes: "", done: false },

      fields: [

        { k: "lastTouched", label: "Last worked on", type: "date", half: true },

  const dlg = document.getElementById("editor");
  const dlgBody = document.getElementById("editor-body");
  const dlgTitle = document.getElementById("editor-title");
  const dlgDelete = document.getElementById("editor-delete");
  let editing = null; // {coll, id|null}

  function fieldHtml(f, val) {
    const id = "f-" + f.k;
    let control;
    if (f.type === "select") {
      control = '<select id="' + id + '" name="' + f.k + '">' + f.options.map((o) =>
        '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(val) ? " selected" : "") + ">" + esc(o[1]) + "</option>").join("") + "</select>";
    } else if (f.type === "textarea") {
      control = '<textarea id="' + id + '" name="' + f.k + '">' + esc(val || "") + "</textarea>";
    } else {
      control = '<input id="' + id + '" name="' + f.k + '" type="' + f.type + '" value="' + esc(val == null ? "" : val) + '"' +
        (f.type === "number" ? ' min="1" step="1"' : "") + (f.required ? " required" : "") + ">";
    }
    return '<div class="field"><label for="' + id + '">' + esc(f.label) + "</label>" + control + "</div>";
  }

  function openEditor(coll, id) {
    const spec = SCHEMA[coll];
    if (!spec) return;
    const doc = id ? find(coll, id) : null;
    if (id && !doc) return;
    const data = doc || spec.blank;
    editing = { coll: coll, id: id || null };
    dlgTitle.textContent = (id ? "Edit " : "New ") + spec.title.toLowerCase();
    let html = "", buffer = [];
    const flush = () => {
      if (!buffer.length) return;
      html += buffer.length === 2 ? '<div class="field-row">' + buffer.join("") + "</div>" : buffer.join("");
      buffer = [];
    };
    for (const f of spec.fields) {
      const cell = fieldHtml(f, data[f.k]);
      if (f.half) { buffer.push(cell); if (buffer.length === 2) flush(); }
      else { flush(); html += cell; }
    }
    flush();
    dlgBody.innerHTML = html;
    dlgDelete.style.display = id ? "" : "none";
    dlg.showModal();
    const first = dlgBody.querySelector("input, select, textarea");
    if (first) first.focus();
  }

  document.getElementById("editor-form").addEventListener("submit", (e) => {
    e.preventDefault();
    if (!editing) return;
    const spec = SCHEMA[editing.coll];
    const out = {};
    for (const f of spec.fields) {
      const el = dlgBody.querySelector('[name="' + f.k + '"]');
      if (!el) continue;
      let v = el.value;
      if (f.type === "number" || f.numeric) v = Number(v) || spec.blank[f.k];
      if ((f.type === "date" || f.type === "time") && !v) v = null;
      out[f.k] = v;
    }
    const nameKey = spec.fields[0].k;
    if (!String(out[nameKey] || "").trim()) { toast("It needs a name."); return; }
    if (editing.coll === "appointments" && out.status === "booked" && !out.date) out.status = "to_book";
    if (editing.coll === "appointments" && out.date && out.status === "to_book") out.status = "booked";
    if (editing.id) patch(editing.coll, editing.id, out);
    else create(editing.coll, Object.assign({}, spec.blank, out));
    dlg.close();
    editing = null;
  });
  document.getElementById("editor-cancel").addEventListener("click", () => { dlg.close(); editing = null; });
  dlgDelete.addEventListener("click", () => {
    if (editing && editing.id) { const e = editing; dlg.close(); editing = null; askDelete(e.coll, e.id); }
  });

  /* =====================================================================
     Toast + undo
     ===================================================================== */
  let toastEl = null, toastTimer = null;
  function toast(msg, undo) {
    if (toastEl) toastEl.remove();
    toastEl = document.createElement("div");
    toastEl.className = "toast";
    toastEl.setAttribute("role", "status");
    toastEl.appendChild(document.createTextNode(msg));
    if (undo) {
      const b = document.createElement("button");
      b.textContent = "Undo";
      b.addEventListener("click", () => { undo(); toastEl.remove(); toastEl = null; });
      toastEl.appendChild(b);
    }
    document.body.appendChild(toastEl);
    clearTimeout(toastTimer);
    const el = toastEl;
    toastTimer = setTimeout(() => { if (el === toastEl) { el.remove(); toastEl = null; } }, undo ? 6000 : 2600);
  }

  function askDelete(coll, id) {
    const doc = find(coll, id);
    if (!doc) return;
    const copy = Object.assign({}, doc);
    remove(coll, id);
    toast("Deleted “" + (doc.title || doc.name || "item") + "”", () => {
      const body = Object.assign({}, copy);
      delete body.id;
      state[coll] = state[coll].concat([copy]);
      render(); saveLocal();
      if (db) db.doc(coll + "/" + copy.id).set(body).catch(reportDbError);
    });
  }

  /* =====================================================================
     Actions
     ===================================================================== */
  document.body.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const act = btn.dataset.act;
    const coll = btn.dataset.coll;
    const id = btn.dataset.id;

    if (act === "nav") {
      view = btn.dataset.view;
      render();
      window.scrollTo({ top: 0, behavior: "auto" });
      return;
    }
    if (act === "toggle") {
      const doc = find(coll, id);
      if (!doc) return;
      patch(coll, id, { done: !doc.done, doneAt: !doc.done ? today() : null });
      return;
    }
    if (act === "edit") { openEditor(coll, id); return; }
    if (act === "new") { openEditor(coll, null); return; }
    if (act === "del") { askDelete(coll, id); return; }
    if (act === "chore-done") {
      const c = find("chores", id);
      patch("chores", id, { lastDone: today() });
      toast("“" + (c ? c.title : "Chore") + "” done — back in " + everyLabel(c && c.everyDays));
      return;
    }
    if (act === "person-touch") {
      const p = find("people", id);
      patch("people", id, { lastContact: today() });
      toast("Logged. " + (p ? p.name : "They") + " is off the list for now.");
      return;
    }
    if (act === "project-touch") {
      patch("projects", id, { lastTouched: today() });
      toast("Nice — clock reset on that one.");
      return;
    }
    if (act === "someday") { patch("projects", id, { status: "someday" }); toast("Parked. It'll wait in Someday."); return; }
    if (act === "clear-bought") {
      const done = state.buy.filter((b) => b.done);
      for (const b of done) remove("buy", b.id);
      toast(done.length + " cleared");
      return;
    }
    if (act === "try") {
      qaInput.value = EXAMPLES[Number(btn.dataset.i)];
      override = null;
      updateHint();
      qaInput.focus();
      return;
    }
    if (act === "preset-chore") {
      const p = CHORE_PRESETS[Number(btn.dataset.i)];
      create("chores", { title: p[0], everyDays: p[1], lastDone: today(), notes: "" });
      return;
    }
    if (act === "seed") { seedSample(); return; }
    if (act === "clear-sample") {
      for (const c of COLLS) for (const d of state[c].filter((x) => x.sample)) remove(c, d.id);
      toast("Examples cleared — the lists are yours now.");
      return;
    }
  });

  async function seedSample() {
    for (const coll of COLLS) {
      for (const doc of SAMPLE[coll]) await create(coll, Object.assign({ sample: true }, doc));
    }
    toast("Example week loaded");
  }

  /* =====================================================================
     Boot
     ===================================================================== */
  loadLocal();
  render();
  connect();
  updateHint();
})();
</script>
